<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <title>KPT Project</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Sidebar Navigation -->
<nav class="app-sidebar no-print" id="appSidebar">
  <div class="app-sidebar__header">
    <div class="app-sidebar__brand">
      <img src="logo1.png" alt="KPT Logo" class="app-sidebar__logo">
    </div>
  </div>
  
  <div class="app-sidebar__nav">
    <a href="#dashboard" class="nav-item" data-route="dashboard">
      <span class="nav-item__icon"><i class="bi bi-speedometer2"></i></span> Dashboard
    </a>
    <div class="nav-section-label">Manajemen</div>
    <a href="#perusahaan" class="nav-item" data-route="perusahaan">
      <span class="nav-item__icon"><i class="bi bi-building"></i></span> Perusahaan
    </a>
    <a href="#proyek" class="nav-item" data-route="proyek">
      <span class="nav-item__icon"><i class="bi bi-clipboard-data"></i></span> Proyek
    </a>
    <a href="#metode" class="nav-item" data-route="metode">
      <span class="nav-item__icon"><i class="bi bi-diagram-3"></i></span> Metode Kerja
    </a>
    <a href="#jsa" class="nav-item" data-route="jsa">
      <span class="nav-item__icon"><i class="bi bi-journal-check"></i></span> JSA
    </a>
    <a href="#manpower" class="nav-item" data-route="manpower">
      <span class="nav-item__icon"><i class="bi bi-people"></i></span> Man Power
    </a>
    <div class="nav-section-label">Logistik & Laporan</div>
    <a href="#pembelian" class="nav-item" data-route="pembelian">
      <span class="nav-item__icon"><i class="bi bi-cart"></i></span> Cost Project
    </a>
    <a href="#laporan" class="nav-item" data-route="laporan">
      <span class="nav-item__icon"><i class="bi bi-file-earmark-pdf"></i></span> Laporan
    </a>
    <div class="nav-section-label" id="navSectionAdmin" style="display:none;">Pengaturan</div>
    <a href="#akun" class="nav-item" data-route="akun" id="navItemAkun" style="display:none;">
      <span class="nav-item__icon"><i class="bi bi-people-fill"></i></span> Manajemen Akun
    </a>
  </div>
</nav>

<!-- Overlay for mobile sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="AppNavbar.closeSidebar()"></div>

<!-- Loading Spinner -->
<div id="navbarLoadingSpinner" style="display:none; position:fixed; top:16px; right:16px; z-index:9999;">
  <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
</div>

<!-- User Info Bar -->
<div class="user-info-bar no-print" id="userInfoBar">
  <div class="user-info-bar__content">
    <div class="user-info-bar__details">
      <div>
        <div class="user-info-bar__name" id="userInfoBarName">User</div>
        <div class="user-info-bar__role" id="userInfoBarRole">Role</div>
      </div>
    </div>
    <button class="user-info-bar__logout" onclick="AppAuth.logout()" title="Keluar">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</div>

<!-- Main Content Area -->
<main class="app-main-content" id="appMainContent"></main>

<!-- Project Detail Modal -->
<div class="modal fade" id="projectDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="projectDetailTitle"><i class="bi bi-clipboard-data"></i> Detail Proyek</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="projectDetailContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- config & constants -->
<script src="config.js" defer></script>
<script src="constants.js" defer></script>

<!-- core services -->
<script src="db.js" defer></script>
<script src="error-handler.js" defer></script>

<!-- page modules — harus SEBELUM main.js -->
<script src="perusahaan.js" defer></script>
<script src="proyek.js" defer></script>
<script src="metode.js" defer></script>
<script src="jsa.js" defer></script>
<script src="mp.js" defer></script>
<script src="pembelian.js" defer></script>
<script src="laporan.js" defer></script>

<!-- auth -->
<script src="login.js" defer></script>

<!-- main — dipindah ke paling akhir -->
<script src="main.js" defer></script>
</body>
</html>
