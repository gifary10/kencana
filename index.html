<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <title>KPT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Top Navbar -->
<nav class="app-navbar no-print" id="appNavbar">
  <div class="app-navbar__left">
    <div class="app-navbar__brand">
      <div class="app-navbar__brand-logo" id="navbarBrandLogo">
        <img src="logo.png" alt="KPT Logo">
      </div>
      <span class="app-navbar__brand-text">KPT Project, safety & finance management system</span>
    </div>
  </div>
  <div class="app-navbar__right">
    <span id="navbarLoadingSpinner" style="display:none; margin-right: 12px;">
      <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
    </span>
    <button class="app-navbar__toggler" id="sidebarToggler" onclick="AppNavbar.toggleSidebar()" title="Toggle Menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</nav>

<!-- Sidebar Navigation -->
<nav class="app-sidebar no-print" id="appSidebar">
  <div class="app-sidebar__nav">
    <div class="nav-section-label">Utama</div>
    <a href="#dashboard" class="nav-item" data-route="dashboard" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-speedometer2"></i></span> Dashboard
    </a>
    <div class="nav-section-label">Manajemen</div>
    <a href="#perusahaan" class="nav-item" data-route="perusahaan" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-building"></i></span> Perusahaan
    </a>
    <a href="#proyek" class="nav-item" data-route="proyek" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-clipboard-data"></i></span> Proyek
    </a>
    <a href="#metode" class="nav-item" data-route="metode" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-diagram-3"></i></span> Metode Kerja
    </a>
    <a href="#jsa" class="nav-item" data-route="jsa" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-journal-check"></i></span> JSA
    </a>
    <a href="#manpower" class="nav-item" data-route="manpower" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-people"></i></span> Man Power
    </a>
    <div class="nav-section-label">Logistik & Laporan</div>
    <a href="#pembelian" class="nav-item" data-route="pembelian" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-cart"></i></span> Cost Project
    </a>
    <a href="#laporan" class="nav-item" data-route="laporan" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-file-earmark-pdf"></i></span> Laporan
    </a>
    <div class="nav-section-label" id="navSectionAdmin" style="display:none;">Pengaturan</div>
    <a href="#akun" class="nav-item" data-route="akun" id="navItemAkun" style="display:none;" onclick="AppNavbar.closeSidebarOnMobile()">
      <span class="nav-item__icon"><i class="bi bi-people-fill"></i></span> Manajemen Akun
    </a>
  </div>

  <div class="sidebar-user-info" id="sidebarUserInfo">
    <div class="sidebar-user-info__header">
      <div class="sidebar-user-details">
        <div class="sidebar-user-name" id="sidebarUserName">User</div>
        <div class="sidebar-user-role" id="sidebarUserRole">Role</div>
      </div>
    </div>
    <button class="sidebar-user-logout" onclick="AppAuth.logout()">
      <i class="bi bi-box-arrow-right"></i> Keluar
    </button>
  </div>
</nav>

<!-- Overlay for mobile sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="AppNavbar.closeSidebar()"></div>

<!-- Main Content Area -->
<main class="app-main-content" id="appMainContent"></main>

<!-- Project Detail Modal -->
<div class="modal fade" id="projectDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="projectDetailTitle"><i class="bi bi-clipboard-data"></i> Detail Proyek</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="projectDetailContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="config.js" defer></script>
<script src="constants.js" defer></script>
<script src="db.js" defer></script>
<script src="main.js" defer></script>
<script src="error-handler.js" defer></script>
<script src="perusahaan.js" defer></script>
<script src="proyek.js" defer></script>
<script src="metode.js" defer></script>
<script src="jsa.js" defer></script>
<script src="mp.js" defer></script>
<script src="pembelian.js" defer></script>
<script src="laporan.js" defer></script>
<script src="login.js" defer></script>
</body>
</html>
